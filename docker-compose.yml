# AI 赋能 Web API 服务 —— 一键编排
# 安全设计：仅 nginx 暴露到宿主机（公网），db/redis/prometheus/grafana 全部在内部网络。

services:
  db:
    image: postgres:16-alpine
    container_name: ai-api-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_pass_123456}
      POSTGRES_DB: ${POSTGRES_DB:-ai_api}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_user} -d ${POSTGRES_DB:-ai_api}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: ai-api-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  app:
    build: .
    container_name: ai-api-app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-api-nginx
    ports:
      - "8080:80"
      # 生产启用 HTTPS 时挂载证书并开放 443，见 nginx/nginx.conf 注释
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 生产证书目录（Let's Encrypt）
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
    networks: [internal]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ai-api-prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - app
    restart: unless-stopped
    networks: [internal]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ai-api-grafana
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:

networks:
  internal:
    driver: bridge
