# Nginx 反向代理配置
# 生产启用 HTTPS：取消 443 监听注释，挂载证书到 /etc/nginx/certs，并参考注释片段。

server {
    listen 80;
    server_name _;

    # 生产 HTTPS（取消注释并配置证书路径）
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # 请求体上限（防止超大文本打爆服务）
    client_max_body_size 2m;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ===== API 转发到 FastAPI =====
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ===== 健康检查 / 文档 =====
    location = /healthz { proxy_pass http://app:8000; }
    location = /readyz  { proxy_pass http://app:8000; }
    location /docs     { proxy_pass http://app:8000; }
    location /redoc    { proxy_pass http://app:8000; }
    location /openapi.json { proxy_pass http://app:8000; }

    # ===== 静态测试页（也可直接由 Nginx 服务，这里转发给 FastAPI 统一管理） =====
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    # ===== Prometheus 指标：生产建议仅内网访问（注释掉下面，用防火墙/网络策略限制） =====
    location = /metrics {
        # allow 127.0.0.1;
        # allow 10.0.0.0/8;   # 内网网段
        # deny all;
        proxy_pass http://app:8000;
    }

    # 静态资源缓存（测试页无独立静态资源，预留）
    location ~* \.(css|js|png|jpg|svg|ico)$ {
        proxy_pass http://app:8000;
        expires 1h;
    }
}
