# Prometheus 采集配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ai-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]   # docker-compose 内部服务名
    relabel_configs:
      # 只采集 /metrics，不采集其他路径
      - source_labels: [__address__]
        regex: ".*"
        target_label: service
        replacement: ai-api
